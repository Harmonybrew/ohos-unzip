name: CI

on:
  release:
    types: [published]
  push:
    branches: [ "main" ]

permissions: write-all

jobs:
  build-and-release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential unzip

      - name: Build
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: unzip-6.0-ohos-arm64.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} unzip-6.0-ohos-arm64.tar.gz --clobber --repo ${{ github.repository }}
